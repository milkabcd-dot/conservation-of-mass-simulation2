<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סימולציה: שימור מסה בהיתוך וקיפאון</title>
  
  <!-- פונט מודרני מבית Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- ספריית תרשימים Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- ספריית קונפטי לחגיגת סיום -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #2563eb, #1d4ed8);
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Rubik', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* כרטיסיית המשחק המרכזית מעוצבת ויוקרתית */
    .sim-card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.15), 0 0 1px 1px rgba(0, 0, 0, 0.05);
      max-width: 520px;
      width: 100%;
      padding: 35px;
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* אזור תמונת הניסוי עם מסגרת נקייה */
    .img-container {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #f1f5f9;
    }

    .main-img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .main-img:hover {
      transform: scale(1.02);
    }

    h2 {
      color: #1e3a8a;
      margin-top: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    p.description {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* אזור התרשים */
    .chart-container {
      position: relative;
      width: 100%;
      height: 190px;
      margin-bottom: 25px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 10px;
      border: 1px solid #e2e8f0;
    }

    /* קבוצת קלט וכפתורים מעוצבים */
    .input-group {
      margin-bottom: 20px;
      animation: fadeIn 0.4s ease-out;
    }

    .input-group p {
      font-weight: 600;
      color: #334155;
      margin-bottom: 12px;
      font-size: 16px;
    }

    input[type="number"] {
      width: 75%;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      text-align: center;
      outline: none;
      font-family: inherit;
      transition: all 0.2s ease;
      background: #fdfdfd;
    }

    input[type="number"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    button {
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 80%;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: all 0.25s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    button:active {
      transform: translateY(0);
    }

    .feedback {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 700;
      min-height: 28px;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="sim-card">
    
    <!-- תמונת הניסוי המעוצבת במסגרת נקייה -->
    <div class="img-container">
      <img src="https://raw.githubusercontent.com/milkabcd-dot/conservation-of-mass-simulation/main/image_68bf19.jpg" alt="שימור מסה בהיתוך" class="main-img" onerror="this.src='https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600&auto=format&fit=crop'">
    </div>

    <h2>ניסוי 1: היתוך קרח בכלי סגור</h2>
    <p class="description">
      לפניכם בקבוק אטום הרמטית עם פקק. בתוכו <b>150 גרם קרח</b>.<br>
      לחצו על הכפתור כדי לחמם את המערכת ולהתיך את הקרח למים במצב צבירה נוזל.
    </p>

    <!-- התרשים הדינמי -->
    <div class="chart-container">
      <canvas id="stateChart"></canvas>
    </div>

    <button id="heat-btn" onclick="meltIce()">חימום המערכת והתכת הקרח 🔥</button>

    <!-- שאלת בדיקת המסה (עם הניסוח שלך) -->
    <div id="question-box" class="input-group hidden">
      <p>מה תהיה מסת המים במצב נוזל בגרמים, לאחר התכת המים במצב צבירה מוצק?</p>
      <input type="number" id="user-mass" placeholder="הכניסי מספר בגרמים...">
      <br>
      <button onclick="checkAnswer()">בדיקת תשובה</button>
    </div>

    <div id="feedback" class="feedback"></div>

  </div>

  <script>
    // יצירת תרשים העוגה הדינמי עם Chart.js
    const ctx = document.getElementById('stateChart').getContext('2d');
    const stateChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['קרח (מוצק)', 'מים (נוזל)'],
        datasets: [{
          data: [150, 0],
          backgroundColor: ['#3b82f6', '#06b6d4'],
          borderWidth: 2,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { 
            position: 'bottom',
            labels: { font: { family: 'Rubik', size: 13 } }
          }
        },
        animation: { duration: 1200 }
      }
    });

    // פונקציה להדמיית ההתכה והעדכון בתרשים
    function meltIce() {
      stateChart.data.datasets[0].data = [0, 150];
      stateChart.update();

      document.getElementById('heat-btn').style.display = 'none';
      document.getElementById('question-box').classList.remove('hidden');
      
      const fb = document.getElementById('feedback');
      fb.style.color = "#0284c7";
      fb.innerText = "הקרח הותך לחלוטין למים במצב צבירה נוזל!";
    }

    // פונקציה לבדיקת התשובה של התלמיד
    function checkAnswer() {
      const val = document.getElementById('user-mass').value.trim();
      const fb = document.getElementById('feedback');

      if (val === "150") {
        fb.style.color = "var(--success)";
        fb.innerText = "כל הכבוד! ✨ חוק שימור המסה נשמר במערכת סגורה (150 גרם)!";
        
        confetti({
          particleCount: 130,
          spread: 80,
          origin: { y: 0.6 }
        });
      } else {
        fb.style.color = "var(--error)";
        fb.innerText = "לא מדויק. האם יצא חומר מהבקבוק האטום בפקק?";
      }
    }
  </script>

</body>
</html>
